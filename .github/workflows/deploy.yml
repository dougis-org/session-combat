name: Deploy to Fly.io

on:
  push:
    branches:
      - main

# Serialize concurrent pushes to main. Without this, each push triggered a parallel
# `flyctl deploy --remote-only` against the same two app VMs, producing two classes of
# failures observed on 2026-08-30:
#   1. `failed to acquire lease on VM` errors when two rolling updates raced the
#      same machines (releases v689/v690 failed at 15:15:35Z).
#   2. `npm ci` runs hanging in the shared Depot build cache when several remote
#      builds arrived simultaneously (deploy runs #609, #610, #600, #612, #613 each
#      stalled on the `RUN npm ci --include=dev` step until cancelled ~50 min later).
# Queueing ensures only one deploy is in flight at a time; the latest main commit wins.
concurrency:
  group: deploy-flyio-main
  cancel-in-progress: false

jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    # Bound the job. Remote-only Depot builds normally finish in ~5 min; allow 25 min
    # for the build, push, and rolling update combined. A timeout here is faster than
    # waiting for an external cancel.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        # `immediate` rolls every machine at once instead of one-at-a-time. Combined with
        # the concurrency group above, this avoids the rolling-leases contention that
        # produced the v689/v690 failures: a single in-flight deploy holds the machines
        # without contending with itself or queued peers.
        run: flyctl deploy --remote-only --strategy immediate
